html<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live P1 Monitor</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #E0E0E0; text-align: center; padding: 40px 20px; }
        h1 { font-size: 28px; margin-bottom: 5px; color: #FFFFFF; }
        .status-tijd { font-size: 14px; color: #888; margin-bottom: 40px; }
        .balk { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .meter { background-color: #1E1E1E; border: 1px solid #333; padding: 25px; border-radius: 12px; flex: 1; min-width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .meter h3 { font-size: 14px; text-transform: uppercase; color: #A0A0A0; margin-bottom: 15px; }
        .getal { font-size: 36px; font-weight: 700; color: #00E676; }
        .meter-totaal { border-color: #00E676; }
    </style>
</head>
<body>
    <h1>Mijn Energie Dashboard (GitHub Cloud)</h1>
    <p class="status-tijd">Laatste meterkast update: <strong id="klok">--:--:--</strong></p>
    <div class="balk">
        <div class="meter meter-totaal"><h3>Totaal Vermogen</h3><div class="getal" id="totaal">0 W</div></div>
        <div class="meter"><h3>Fase 1 (L1)</h3><div class="getal" id="fase1">0 W</div></div>
        <div class="meter"><h3>Fase 2 (L2)</h3><div class="getal" id="fase2">0 W</div></div>
        <div class="meter"><h3>Fase 3 (L3)</h3><div class="getal" id="fase3">0 W</div></div>
    </div>

    <script>
        // HIER HALEN WE DE DATA GRATIS EN RECHTSTREEKS BIJ JOUW AWARDSPACE OP!
        const dataUrl = "http://berghs.atwebpages.com"; // <--- Verander 'berghsp1' eventueel naar je eigen subdomeinnaam!

        async function updateDashboard() {
            try {
                const response = await fetch(dataUrl);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totaal').innerText = data.totaal + " W";
                    document.getElementById('fase1').innerText = data.fase1 + " W";
                    document.getElementById('fase2').innerText = data.fase2 + " W";
                    document.getElementById('fase3').innerText = data.fase3 + " W";
                    document.getElementById('klok').innerText = data.tijd;
                }
            } catch (error) {
                console.log("Wachten op data...", error);
            }
        }
        // Ververs de cijfers automatisch elke 10 seconden op je scherm
        setInterval(updateDashboard, 10000);
        updateDashboard();
    </script>
</body>
</html>
